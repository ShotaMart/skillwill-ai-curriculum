<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skillwill AI — საპრეზენტაციო სლაიდები</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script src="presentations_data.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+GO:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Fira GO', sans-serif; }
    .slide-aspect { aspect-ratio: 16 / 9; }
    .tab-btn.active {
      background-color: #D52B1E;
      color: white;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-2 sm:p-4 md:p-6 flex flex-col items-center">

  <!-- Top Navigation & Controls Bar -->
  <header class="w-full max-w-6xl flex flex-wrap items-center justify-between gap-3 pb-3 mb-3 border-b border-slate-800 text-sm">
    <div class="flex flex-wrap items-center gap-2.5">
      <a href="index.html" class="px-3.5 py-1.5 bg-[#D52B1E] hover:bg-red-700 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-md">
        <span>⬅️</span> პორტალზე დაბრუნება
      </a>

      <!-- Course Selector -->
      <select id="course-select" onchange="onCourseChange()" class="bg-slate-800 text-slate-100 text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:border-red-500">
        <option value="course1">მოდული 5 (06.7.1.1) • 39 ლექცია</option>
        <option value="course2">მოდული 7 (06.7.1.3) • 64 ლექცია</option>
      </select>

      <!-- Lecture Selector -->
      <select id="lecture-select" onchange="onLectureChange()" class="bg-slate-800 text-slate-100 text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700 max-w-xs md:max-w-md truncate focus:outline-none focus:border-red-500">
        <!-- populated dynamically -->
      </select>
    </div>

    <!-- Slide Navigation & Fullscreen -->
    <div class="flex items-center gap-2">
      <button onclick="prevSlide()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-semibold transition flex items-center gap-1">
        ◀ წინა
      </button>
      <span id="slide-counter" class="font-mono text-xs px-2.5 py-1 bg-slate-900 rounded-lg text-slate-300 border border-slate-700">
        1 / 8
      </span>
      <button onclick="nextSlide()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1">
        შემდეგი ▶
      </button>
      <button onclick="toggleFullscreen()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold transition flex items-center gap-1" title="სრული ეკრანი (F)">
        ⛶
      </button>
    </div>
  </header>

  <!-- Mode Tabs: Slides | Script -->
  <nav class="w-full max-w-6xl flex items-center justify-between gap-2 mb-3">
    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-bold">
      <button id="tab-slides-btn" onclick="setMode('slides')" class="tab-btn active px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5">
        🖥️ სლაიდები (Slide Deck)
      </button>
      <button id="tab-script-btn" onclick="setMode('script')" class="tab-btn text-slate-300 hover:text-white px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5">
        🎙️ ლექტორის სკრიპტი
      </button>
    </div>
    
    <div id="lecture-meta-pill" class="text-xs text-slate-400 hidden sm:block truncate font-medium">
      <!-- metadata -->
    </div>
  </nav>

  <!-- VIEW 1: Slides Deck Container -->
  <div id="slides-view" class="w-full max-w-6xl flex flex-col items-center">
    <!-- Slide Stage -->
    <div id="slide-stage" class="w-full slide-aspect bg-white text-slate-900 rounded-2xl shadow-2xl overflow-hidden relative border border-slate-800 select-none">
      <!-- Slide dynamically injected here -->
    </div>

    <!-- Slide Thumbnails / Quick Jump bar -->
    <div id="slide-dots" class="flex flex-wrap items-center justify-center gap-1.5 mt-3">
      <!-- injected dots -->
    </div>

    <!-- Active Slide Spoken Script Bar (Under slide preview) -->
    <div class="w-full mt-4 bg-slate-900 border border-slate-800 rounded-xl p-4 text-xs text-slate-300">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-2">
        <span class="font-bold text-[#D52B1E] flex items-center gap-1.5 uppercase tracking-wide">
          🎙️ მიმდინარე სლაიდის სამეტყველო სკრიპტი:
        </span>
        <div class="flex items-center gap-2">
          <span class="text-slate-500 font-mono text-[11px]">ლექტორის საუბარი</span>
          <button onclick="copyCurrentScript()" id="copy-script-btn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-[11px] font-semibold transition flex items-center gap-1 border border-slate-700">
            📋 კოპირება
          </button>
        </div>
      </div>
      <p id="current-slide-script" class="leading-relaxed text-sm text-slate-200">
        <!-- Spoken text -->
      </p>
    </div>
  </div>

  <!-- VIEW 2: Full Lecturer Script for entire lecture -->
  <div id="script-view" class="w-full max-w-6xl hidden bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-8">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
      <div>
        <span class="text-xs font-bold text-[#D52B1E] uppercase tracking-wide">სალექციო სკრიპტი</span>
        <h2 id="script-full-title" class="text-xl md:text-2xl font-black text-white mt-1"></h2>
        <p class="text-xs text-slate-400 mt-1">სრული სამეტყველო ტექსტი თითოეული სლაიდისთვის</p>
      </div>
      <button onclick="setMode('slides')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg text-slate-200">
        🖥️ სლაიდებზე გადასვლა
      </button>
    </div>

    <div id="script-cards-container" class="space-y-4">
      <!-- Injected script cards -->
    </div>
  </div>

  <footer class="mt-8 text-center text-xs text-slate-500 pb-6">
    Skillwill AI Curriculum • საპრეზენტაციო მასალები
  </footer>

  <script>
    // State
    let currentCourse = 'course1';
    let currentLectureNum = 1;
    let currentSlideIdx = 0;
    let currentMode = 'slides'; // 'slides' | 'script'

    // Init on Load
    window.addEventListener('DOMContentLoaded', () => {
      parseUrlParams();
      populateLectureSelect();
      renderAll();
      attachKeyboardNavigation();
    });

    function parseUrlParams() {
      const urlParams = new URLSearchParams(window.location.search);
      const c = urlParams.get('course');
      const l = urlParams.get('lec');
      if (c && (c === 'course1' || c === 'course2')) {
        currentCourse = c;
      }
      if (l && !isNaN(l)) {
        currentLectureNum = parseInt(l, 10);
      }
      document.getElementById('course-select').value = currentCourse;
    }

    function updateUrl() {
      const newUrl = `${window.location.pathname}?course=${currentCourse}&lec=${currentLectureNum}`;
      window.history.replaceState({}, '', newUrl);
    }

    function onCourseChange() {
      currentCourse = document.getElementById('course-select').value;
      currentLectureNum = 1;
      currentSlideIdx = 0;
      updateUrl();
      populateLectureSelect();
      renderAll();
    }

    function onLectureChange() {
      currentLectureNum = parseInt(document.getElementById('lecture-select').value, 10);
      currentSlideIdx = 0;
      updateUrl();
      renderAll();
    }

    function populateLectureSelect() {
      const select = document.getElementById('lecture-select');
      select.innerHTML = '';
      const courseData = PRESENTATIONS_DATA[currentCourse];
      if (!courseData) return;

      const keys = Object.keys(courseData).map(Number).sort((a,b) => a - b);
      keys.forEach(k => {
        const item = courseData[String(k)];
        const opt = document.createElement('option');
        opt.value = k;
        opt.textContent = `ლექცია #${k}: ${item.title}`;
        if (k === currentLectureNum) {
          opt.selected = true;
        }
        select.appendChild(opt);
      });
    }

    function getDeck() {
      const courseData = PRESENTATIONS_DATA[currentCourse] || {};
      return courseData[String(currentLectureNum)] || courseData["1"] || null;
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('tab-slides-btn').className = `tab-btn ${mode === 'slides' ? 'active' : 'text-slate-300 hover:text-white'} px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5`;
      document.getElementById('tab-script-btn').className = `tab-btn ${mode === 'script' ? 'active' : 'text-slate-300 hover:text-white'} px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5`;

      document.getElementById('slides-view').classList.toggle('hidden', mode !== 'slides');
      document.getElementById('script-view').classList.toggle('hidden', mode !== 'script');
    }

    function renderAll() {
      const deck = getDeck();
      if (!deck) return;

      document.getElementById('lecture-meta-pill').textContent = deck.title;
      renderSlide();
      renderDots();
      renderFullScript(deck);
    }

    function renderSlide() {
      const deck = getDeck();
      if (!deck || !deck.slides || deck.slides.length === 0) return;

      if (currentSlideIdx < 0) currentSlideIdx = 0;
      if (currentSlideIdx >= deck.slides.length) currentSlideIdx = deck.slides.length - 1;

      const slide = deck.slides[currentSlideIdx];
      const stage = document.getElementById('slide-stage');
      document.getElementById('slide-counter').textContent = `${currentSlideIdx + 1} / ${deck.slides.length}`;
      document.getElementById('current-slide-script').textContent = slide.script || '';

      stage.innerHTML = generateSlideHtml(slide, deck);
    }

    function generateSlideHtml(slide, deck) {
      const assets = PRESENTATIONS_DATA.assets || {};
      const logoImg = assets.logo || '';
      const cornerBL = assets.corner_bl || '';
      const cornerTR = assets.corner_tr || '';

      // SLIDE 1: Exact Template Cover (Logo + Title in #D52B1E + Corners)
      if (slide.type === 'cover') {
        return `
          <div class="w-full h-full p-6 md:p-12 flex flex-col justify-between items-center bg-white relative">
            <img src="${cornerTR}" alt="" class="absolute top-0 right-0 w-[12%] max-w-[140px] pointer-events-none select-none" />
            <img src="${cornerBL}" alt="" class="absolute bottom-0 left-0 w-[12%] max-w-[140px] pointer-events-none select-none" />

            <div class="my-auto flex flex-col items-center justify-center text-center px-6 max-w-4xl z-10">
              <img src="${logoImg}" alt="SKILLWILL" class="h-10 sm:h-12 md:h-14 object-contain mb-8 select-none" />
              <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-black text-[#D52B1E] leading-tight tracking-wide uppercase">
                ${slide.title}
              </h1>
            </div>
          </div>
        `;
      }

      // SLIDE 8: Exact Template Closing (მადლობა ყურადღებისთვის! in Black + Corners)
      if (slide.type === 'end') {
        return `
          <div class="w-full h-full p-6 md:p-12 flex flex-col justify-center items-center bg-white relative">
            <img src="${cornerTR}" alt="" class="absolute top-0 right-0 w-[12%] max-w-[140px] pointer-events-none select-none" />
            <img src="${cornerBL}" alt="" class="absolute bottom-0 left-0 w-[12%] max-w-[140px] pointer-events-none select-none" />

            <div class="text-center px-6 z-10">
              <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-black text-slate-900 leading-tight tracking-wide">
                ${slide.title}
              </h1>
            </div>
          </div>
        `;
      }

      // Inside Content Slides Template
      const innerCorner = `
        <img src="${cornerTR}" alt="" class="absolute top-0 right-0 w-[8%] max-w-[80px] pointer-events-none select-none opacity-80" />
      `;

      if (slide.type === 'agenda') {
        return `
          <div class="w-full h-full p-6 md:p-10 flex flex-col justify-between bg-slate-50 relative">
            ${innerCorner}
            <div class="border-b border-slate-200 pb-3 flex justify-between items-end">
              <div>
                <span class="text-xs font-bold text-[#D52B1E] uppercase tracking-wide">გეგმა</span>
                <h2 class="text-xl md:text-2xl font-extrabold text-slate-900">${slide.title}</h2>
              </div>
              <span class="text-xs text-slate-400 font-mono">სლაიდი ${slide.slideNum} / ${deck.slides.length}</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 my-auto">
              ${(slide.items || []).map(item => `
                <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between hover:border-red-300 transition">
                  <div>
                    <span class="px-3 py-1 bg-[#D52B1E] text-white font-black text-xs rounded">${item.num}</span>
                    <h3 class="text-base md:text-lg font-bold text-slate-900 mt-3.5">${item.title}</h3>
                    <p class="text-xs md:text-sm text-slate-600 mt-2 leading-relaxed">${item.desc}</p>
                  </div>
                  <div class="mt-4 pt-2 border-t border-slate-100 text-[11px] text-slate-400 font-medium">საკვანძო მიმართულება</div>
                </div>
              `).join('')}
            </div>

            <div class="flex justify-between items-center text-xs text-slate-400 border-t border-slate-200 pt-2">
              <span class="font-bold text-slate-500">SKILLWILL</span>
              <span>სალექციო პრეზენტაცია</span>
            </div>
          </div>
        `;
      }

      if (slide.type === 'concept') {
        return `
          <div class="w-full h-full p-6 md:p-10 flex flex-col justify-between bg-slate-50 relative">
            ${innerCorner}
            <div class="border-b border-slate-200 pb-3 flex justify-between items-end">
              <div>
                <span class="text-xs font-bold text-[#D52B1E] uppercase tracking-wide">თეორია</span>
                <h2 class="text-xl md:text-2xl font-extrabold text-slate-900">${slide.title}</h2>
              </div>
              <span class="text-xs text-slate-400 font-mono">სლაიდი ${slide.slideNum} / ${deck.slides.length}</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 my-auto">
              ${(slide.cards || []).map((c, i) => `
                <div class="bg-white rounded-xl p-6 border ${i === 0 ? 'border-red-200 bg-red-50/20' : i === 1 ? 'border-blue-200 bg-blue-50/20' : 'border-slate-200'} shadow-sm flex flex-col justify-between">
                  <div>
                    <span class="text-[11px] font-bold ${i === 0 ? 'text-[#D52B1E]' : i === 1 ? 'text-blue-600' : 'text-slate-500'} uppercase tracking-wider">${c.tag}</span>
                    <h3 class="text-base md:text-lg font-bold text-slate-900 mt-2.5">${c.title}</h3>
                    <p class="text-xs md:text-sm text-slate-600 mt-2.5 leading-relaxed font-normal">${c.text}</p>
                  </div>
                  <div class="mt-4 pt-2 border-t border-slate-100 text-[11px] text-slate-400 font-medium">საფუძვლები</div>
                </div>
              `).join('')}
            </div>

            <div class="flex justify-between items-center text-xs text-slate-400 border-t border-slate-200 pt-2">
              <span class="font-bold text-slate-500">SKILLWILL</span>
              <span>სალექციო პრეზენტაცია</span>
            </div>
          </div>
        `;
      }

      if (slide.type === 'comparison') {
        return `
          <div class="w-full h-full p-6 md:p-10 flex flex-col justify-between bg-slate-50 relative">
            ${innerCorner}
            <div class="border-b border-slate-200 pb-3 flex justify-between items-end">
              <div>
                <span class="text-xs font-bold text-[#D52B1E] uppercase tracking-wide">მოდელი</span>
                <h2 class="text-xl md:text-2xl font-extrabold text-slate-900">${slide.title}</h2>
              </div>
              <span class="text-xs text-slate-400 font-mono">სლაიდი ${slide.slideNum} / ${deck.slides.length}</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 my-auto">
              <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
                <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
                  <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                  <h3 class="text-sm md:text-base font-bold text-slate-700">${slide.col1 ? slide.col1.title : 'საბაზისო მიდგომა'}</h3>
                </div>
                <ul class="mt-4 space-y-2.5 text-xs md:text-sm text-slate-600">
                  ${((slide.col1 && slide.col1.points) || []).map(p => `
                    <li class="flex items-start gap-2">
                      <span class="text-slate-400 font-bold">•</span>
                      <span>${p}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>

              <div class="bg-white rounded-xl p-6 border border-red-200 shadow-sm bg-red-50/10">
                <div class="flex items-center gap-2 pb-3 border-b border-red-100">
                  <span class="w-2.5 h-2.5 rounded-full bg-[#D52B1E]"></span>
                  <h3 class="text-sm md:text-base font-bold text-[#D52B1E]">${slide.col2 ? slide.col2.title : 'მოწინავე AI მიდგომა'}</h3>
                </div>
                <ul class="mt-4 space-y-2.5 text-xs md:text-sm text-slate-700 font-medium">
                  ${((slide.col2 && slide.col2.points) || []).map(p => `
                    <li class="flex items-start gap-2">
                      <span class="text-[#D52B1E] font-bold">✓</span>
                      <span>${p}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>
            </div>

            <div class="flex justify-between items-center text-xs text-slate-400 border-t border-slate-200 pt-2">
              <span class="font-bold text-slate-500">SKILLWILL</span>
              <span>სისტემური მოდელი</span>
            </div>
          </div>
        `;
      }

      if (slide.type === 'rules') {
        return `
          <div class="w-full h-full p-6 md:p-10 flex flex-col justify-between bg-slate-50 relative">
            ${innerCorner}
            <div class="border-b border-slate-200 pb-3 flex justify-between items-end">
              <div>
                <span class="text-xs font-bold text-[#D52B1E] uppercase tracking-wide">სტანდარტები</span>
                <h2 class="text-xl md:text-2xl font-extrabold text-slate-900">${slide.title}</h2>
              </div>
              <span class="text-xs text-slate-400 font-mono">სლაიდი ${slide.slideNum} / ${deck.slides.length}</span>
            </div>

            <div class="space-y-3.5 my-auto">
              ${(slide.rules || []).map(r => `
                <div class="bg-white p-4.5 rounded-xl border border-slate-200 shadow-sm flex items-start gap-4 hover:border-red-300 transition">
                  <span class="px-3 py-1 bg-[#D52B1E] text-white font-black text-xs rounded">${r.num}</span>
                  <div class="flex-1">
                    <h3 class="text-sm md:text-base font-bold text-slate-900">${r.title}</h3>
                    <p class="text-xs md:text-sm text-slate-600 mt-1 leading-relaxed">${r.desc}</p>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="flex justify-between items-center text-xs text-slate-400 border-t border-slate-200 pt-2">
              <span class="font-bold text-slate-500">SKILLWILL</span>
              <span>საუკეთესო პრაქტიკა</span>
            </div>
          </div>
        `;
      }

      if (slide.type === 'case') {
        const b = slide.box || {};
        return `
          <div class="w-full h-full p-6 md:p-10 flex flex-col justify-between bg-slate-50 relative">
            ${innerCorner}
            <div class="border-b border-slate-200 pb-3 flex justify-between items-end">
              <div>
                <span class="text-xs font-bold text-[#D52B1E] uppercase tracking-wide">ქეისი</span>
                <h2 class="text-xl md:text-2xl font-extrabold text-slate-900">${slide.title}</h2>
              </div>
              <span class="text-xs text-slate-400 font-mono">სლაიდი ${slide.slideNum} / ${deck.slides.length}</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 my-auto">
              <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
                <span class="text-[11px] font-bold text-slate-500 uppercase">გამოწვევა</span>
                <h3 class="text-sm md:text-base font-bold text-slate-900 mt-2">პრობლემის ანალიზი</h3>
                <p class="text-xs md:text-sm text-slate-600 mt-2 leading-relaxed">${b.scenario || ''}</p>
              </div>

              <div class="bg-white rounded-xl p-6 border border-blue-200 shadow-sm bg-blue-50/20">
                <span class="text-[11px] font-bold text-blue-600 uppercase">AI გადაწყვეტა</span>
                <h3 class="text-sm md:text-base font-bold text-slate-900 mt-2">დანერგილი მოდელი</h3>
                <p class="text-xs md:text-sm text-slate-600 mt-2 leading-relaxed">${b.solution || ''}</p>
              </div>

              <div class="bg-white rounded-xl p-6 border border-emerald-200 shadow-sm bg-emerald-50/20">
                <span class="text-[11px] font-bold text-emerald-600 uppercase">შედეგი / Impact</span>
                <h3 class="text-sm md:text-base font-bold text-slate-900 mt-2">ბიზნეს ეფექტი</h3>
                <p class="text-xs md:text-sm text-slate-600 mt-2 leading-relaxed">${b.impact || ''}</p>
              </div>
            </div>

            <div class="flex justify-between items-center text-xs text-slate-400 border-t border-slate-200 pt-2">
              <span class="font-bold text-slate-500">SKILLWILL</span>
              <span>რეალური პრაქტიკა</span>
            </div>
          </div>
        `;
      }

      if (slide.type === 'summary') {
        return `
          <div class="w-full h-full p-6 md:p-10 flex flex-col justify-between bg-slate-50 relative">
            ${innerCorner}
            <div class="border-b border-slate-200 pb-3 flex justify-between items-end">
              <div>
                <span class="text-xs font-bold text-[#D52B1E] uppercase tracking-wide">დასკვნები</span>
                <h2 class="text-xl md:text-2xl font-extrabold text-slate-900">${slide.title}</h2>
              </div>
              <span class="text-xs text-slate-400 font-mono">სლაიდი ${slide.slideNum} / ${deck.slides.length}</span>
            </div>

            <div class="space-y-3.5 my-auto">
              ${(slide.takeaways || []).map((t, idx) => `
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-3">
                  <div class="w-8 h-8 rounded-full bg-red-50 text-[#D52B1E] font-black flex items-center justify-center shrink-0">
                    ${idx + 1}
                  </div>
                  <p class="text-sm md:text-base text-slate-800 font-bold leading-relaxed">${t}</p>
                </div>
              `).join('')}
            </div>

            <div class="flex justify-between items-center text-xs text-slate-400 border-t border-slate-200 pt-2">
              <span class="font-bold text-slate-500">SKILLWILL</span>
              <span>შეჯამება</span>
            </div>
          </div>
        `;
      }

      return `
        <div class="w-full h-full p-8 flex flex-col justify-between bg-white">
          <h2 class="text-2xl font-bold">${slide.title}</h2>
        </div>
      `;
    }

    function renderDots() {
      const deck = getDeck();
      if (!deck) return;
      const container = document.getElementById('slide-dots');
      container.innerHTML = '';

      deck.slides.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.onclick = () => { currentSlideIdx = idx; renderSlide(); renderDots(); };
        const isActive = idx === currentSlideIdx;
        btn.className = `w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center ${
          isActive ? 'bg-[#D52B1E] text-white shadow-md' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200'
        }`;
        btn.textContent = idx + 1;
        btn.title = `სლაიდი #${idx + 1}: ${s.title}`;
        container.appendChild(btn);
      });
    }

    function prevSlide() {
      if (currentSlideIdx > 0) {
        currentSlideIdx--;
        renderSlide();
        renderDots();
      }
    }

    function nextSlide() {
      const deck = getDeck();
      if (deck && currentSlideIdx < deck.slides.length - 1) {
        currentSlideIdx++;
        renderSlide();
        renderDots();
      }
    }

    function toggleFullscreen() {
      const stage = document.getElementById('slide-stage');
      if (!document.fullscreenElement) {
        stage.requestFullscreen().catch(err => alert(`Error: ${err.message}`));
      } else {
        document.exitFullscreen();
      }
    }

    function attachKeyboardNavigation() {
      window.addEventListener('keydown', (e) => {
        if (currentMode !== 'slides') return;
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prevSlide();
        } else if (e.key.toLowerCase() === 'f') {
          toggleFullscreen();
        }
      });
    }

    // Render Full Script View
    function renderFullScript(deck) {
      document.getElementById('script-full-title').textContent = deck.title;
      const container = document.getElementById('script-cards-container');
      container.innerHTML = '';

      deck.slides.forEach((s, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-slate-800/80 border border-slate-700 rounded-xl p-4 transition hover:border-slate-600';
        card.innerHTML = `
          <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-700/60">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded bg-[#D52B1E] text-white text-xs font-bold font-mono">
                სლაიდი #${idx + 1}
              </span>
              <span class="text-sm font-bold text-white">${s.title}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-400 font-mono">ლექტორის საუბარი</span>
              <button onclick="copyScriptText(${idx})" id="copy-full-script-btn-${idx}" class="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-xs transition">
                📋 კოპირება
              </button>
            </div>
          </div>
          <p id="full-script-text-${idx}" class="text-sm text-slate-200 leading-relaxed pl-1">${s.script || 'სკრიპტი მზადდება...'}</p>
        `;
        container.appendChild(card);
      });
    }

    function copyCurrentScript() {
      const txt = document.getElementById('current-slide-script').textContent.trim();
      if (!txt) return;
      navigator.clipboard.writeText(txt).then(() => {
        const btn = document.getElementById('copy-script-btn');
        if (btn) {
          const original = btn.innerHTML;
          btn.innerHTML = '✅ დაკოპირდა!';
          setTimeout(() => btn.innerHTML = original, 2000);
        }
      });
    }

    function copyScriptText(idx) {
      const el = document.getElementById(`full-script-text-${idx}`);
      if (!el) return;
      const txt = el.textContent.trim();
      navigator.clipboard.writeText(txt).then(() => {
        const btn = document.getElementById(`copy-full-script-btn-${idx}`);
        if (btn) {
          const original = btn.innerHTML;
          btn.innerHTML = '✅ დაკოპირდა!';
          setTimeout(() => btn.innerHTML = original, 2000);
        }
      });
    }
  </script>
</body>
</html>
